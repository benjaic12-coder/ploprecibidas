name: Verify and publish Plop to Cloudflare

on:
  push:
    branches: [codex/plop-nuevo-2026-10-13]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plop-cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/codex/plop-nuevo-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://plop-recibidas.pages.dev
      CLOUDFLARE_ACCOUNT_ID: 050d03453800b9195278522d68c479ff
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm run build:cloudflare
      - name: Check publication credential
        id: credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::warning::Build verified. Publication awaits the CLOUDFLARE_API_TOKEN repository secret.'
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.credential.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node node_modules/wrangler/bin/wrangler.js pages deploy dist-cloudflare --project-name plop-recibidas --branch codex/plop-nuevo-2026-10-13
      - name: Summary
        env:
          CREDENTIAL_READY: ${{ steps.credential.outputs.ready }}
        run: |
          if [[ "$CREDENTIAL_READY" == 'true' ]]; then
            echo 'Published: https://plop-recibidas.pages.dev/' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Build verified; automatic publication is NOT active. Configure CLOUDFLARE_API_TOKEN, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
