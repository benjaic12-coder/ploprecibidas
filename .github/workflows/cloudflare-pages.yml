name: Verify and publish Plop to Cloudflare

on:
  push:
    branches: [codex/plop-nuevo-2026-10-13, ux-mobile-checkout-20261116]
  pull_request:
    branches: [codex/plop-nuevo-2026-10-13]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plop-cloudflare-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == 'codex/plop-nuevo-2026-10-13' || github.ref_name == 'ux-mobile-checkout-20261116') ||
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ux-mobile-checkout-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLOP_BRANCH: ${{ github.head_ref || github.ref_name }}
      SITE_URL: https://ploprecibidas.com.ar
      CLOUDFLARE_ACCOUNT_ID: 050d03453800b9195278522d68c479ff
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        # Keep existing warnings visible and reject any increase.
        run: pnpm lint --max-warnings=183
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm run build:cloudflare
      - name: Test the mobile store with an isolated API
        if: env.PLOP_BRANCH == 'ux-mobile-checkout-20261116'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/plop-browser" --no-save playwright@1.58.2
          node "$RUNNER_TEMP/plop-browser/node_modules/playwright/cli.js" install --with-deps chromium
          cp scripts/smoke-store-mobile.mjs "$RUNNER_TEMP/plop-browser/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-cloudflare &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:4173/ >/dev/null
          PLOP_TEST_CATALOG="$PWD/lib/catalog.ts" node "$RUNNER_TEMP/plop-browser/smoke-store-mobile.mjs"
      - name: Check publication credential
        id: credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::warning::Build verified. Publication awaits the CLOUDFLARE_API_TOKEN repository secret.'
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.credential.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node node_modules/wrangler/bin/wrangler.js pages deploy dist-cloudflare --project-name plop-recibidas --branch "$PLOP_BRANCH"
      - name: Verify production routes and retained assets
        if: steps.credential.outputs.ready == 'true' && github.ref_name == 'codex/plop-nuevo-2026-10-13'
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/smoke-production.mjs
      - name: Summary
        env:
          CREDENTIAL_READY: ${{ steps.credential.outputs.ready }}
        run: |
          if [[ "$CREDENTIAL_READY" == 'true' && "$PLOP_BRANCH" == 'ux-mobile-checkout-20261116' ]]; then
            echo 'Preview: https://ux-mobile-checkout-20261116.plop-recibidas.pages.dev/' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$CREDENTIAL_READY" == 'true' ]]; then
            echo 'Published: https://plop-recibidas.pages.dev/' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Build verified; automatic publication is NOT active. Configure CLOUDFLARE_API_TOKEN, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
