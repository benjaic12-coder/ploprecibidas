<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Calendario de pedidos · Plop</title>
<style>
:root{font-family:system-ui,sans-serif;color:#39304c;background:#fff8ed}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:22px}a{color:inherit}header,.tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}h1{margin:8px 0}button{border:2px solid #39304c;border-radius:12px;background:#ffd94f;padding:10px 14px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:16px}.weekday{text-align:center;font-size:12px;font-weight:800}.day{background:white;border:1px solid #eadbd6;border-radius:12px;min-height:105px;padding:9px;text-align:left;display:flex;flex-direction:column;gap:5px}.day[aria-pressed=true]{outline:3px solid #f483b7}.day:disabled{background:#f4eee8;cursor:default}.date{font-weight:800}.count{font-size:12px}.free{color:#24785b}.full{color:#a13c5b}.details{background:white;border:1px solid #eadbd6;border-radius:14px;margin-top:20px;padding:18px}li{margin:10px 0}#status{min-height:24px}@media(max-width:650px){main{padding:12px}.grid{gap:3px}.day{padding:5px;min-height:85px}.count{font-size:10px}.weekday{font-size:10px}}</style></head><body>
<main><header><div><a href="/admin/kpis.html">← Volver al panel</a><h1>Calendario de pedidos</h1></div><div class="tools"><button id="prev" type="button" aria-label="Mes anterior">←</button><strong id="month"></strong><button id="next" type="button" aria-label="Mes siguiente">→</button></div></header>
<p>Vista preliminar basada en los últimos 100 pedidos registrados. Capacidad orientativa: 10 pedidos por día. Las fechas completas requieren consultar al administrador. Este calendario no bloquea nuevas reservas por sí solo.</p><p id="status" role="status"></p><section id="grid" class="grid" aria-label="Calendario mensual"></section><section class="details"><h2 id="selectedTitle">Seleccioná una fecha</h2><ul id="orders"></ul></section></main>
<script>
const limit=10,now=new Date(),monthDate=new Date(now.getFullYear(),now.getMonth(),1),grid=document.querySelector('#grid'),status=document.querySelector('#status'),ordersList=document.querySelector('#orders');
let entries=[],selected='';
const iso=(y,m,d)=>[y,String(m+1).padStart(2,'0'),String(d).padStart(2,'0')].join('-');
const format=d=>new Intl.DateTimeFormat('es-AR',{dateStyle:'long'}).format(d);
const countable=o=>!['cancelled','canceled','cancelado','cancelada'].includes(String(o.status||'').toLowerCase());
const draw=()=>{const y=monthDate.getFullYear(),m=monthDate.getMonth(),last=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;document.querySelector('#month').textContent=new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(monthDate);grid.replaceChildren();for(const day of ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']){const e=document.createElement('div');e.className='weekday';e.textContent=day;grid.append(e)}for(let i=0;i<offset;i++){const e=document.createElement('div');grid.append(e)}for(let d=1;d<=last;d++){const key=iso(y,m,d),dayOrders=entries.filter(o=>o.delivery_date===key&&countable(o)),count=dayOrders.length,b=document.createElement('button');b.type='button';b.className='day';b.setAttribute('aria-pressed',String(selected===key));const n=document.createElement('span');n.className='date';n.textContent=d;const c=document.createElement('span');c.className='count '+(count>=limit?'full':'free');c.textContent=count>=limit?'Cupo completo':count+' / '+limit+' pedidos';b.append(n,c);b.addEventListener('click',()=>select(key));grid.append(b)}};
const select=key=>{selected=key;draw();document.querySelector('#selectedTitle').textContent=format(new Date(key+'T12:00:00'));ordersList.replaceChildren();const daily=entries.filter(o=>o.delivery_date===key);if(!daily.length){const li=document.createElement('li');li.textContent='Sin pedidos para esta fecha.';ordersList.append(li)}for(const o of daily){const li=document.createElement('li');li.textContent=[o.order_number,o.customer_name,o.status].filter(Boolean).join(' · ');ordersList.append(li)}};
const load=async()=>{status.textContent='Cargando pedidos…';try{const r=await fetch('/api/orders',{credentials:'same-origin'});if(r.status===401){status.textContent='Tu sesión venció. Ingresá desde el panel administrativo.';grid.replaceChildren();return}if(!r.ok)throw Error('No se pudieron consultar los pedidos.');const data=await r.json();entries=data.orders||[];if(entries.length>=100)status.textContent='Advertencia: se alcanzó el límite de 100 registros. Los cupos pueden estar incompletos.';else status.textContent='Vista preliminar de pedidos recientes; verificá cupos antes de confirmar.';selected='';ordersList.replaceChildren();document.querySelector('#selectedTitle').textContent='Seleccioná una fecha';draw()}catch(e){status.textContent=e.message;grid.replaceChildren()}};
document.querySelector('#prev').addEventListener('click',()=>{monthDate.setMonth(monthDate.getMonth()-1);load()});document.querySelector('#next').addEventListener('click',()=>{monthDate.setMonth(monthDate.getMonth()+1);load()});load();
</script></body></html>
