<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPIs · Plop Recibidas</title>
<style>
:root{--ink:#39304c;--cream:#fff8ed;--mint:#bfe8df;--pink:#f483b7;--yellow:#ffd94f;--line:#eadbd6}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 60px}h1{font-size:clamp(2rem,5vw,4rem);line-height:.95;margin:0 0 8px}.muted{color:#765f59}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:18px 0}.toolbar label{display:grid;gap:5px;font-weight:700;font-size:.85rem}.toolbar input{padding:10px;border:2px solid var(--ink);border-radius:10px;background:#fff}.toolbar button{padding:11px 15px;border:2px solid var(--ink);border-radius:999px;background:var(--yellow);font-weight:800;cursor:pointer}.token{min-width:240px}.status{min-height:24px}.error{color:#a13c5b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{border:2px solid var(--ink);border-radius:16px;background:#fff;padding:16px;box-shadow:4px 5px 0 var(--ink)}.card small{display:block;color:#765f59}.card strong{display:block;font-size:1.8rem;margin-top:7px}.panel{margin-top:18px}.panel h2{margin:0 0 12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.table{font-size:.8rem}}
</style></head>
<body><main class="wrap"><p class="muted">Plop Recibidas · panel privado</p><h1>KPIs del catálogo</h1><p class="muted">Pedidos, facturación y embudo de conversión del período seleccionado.</p>
<section class="toolbar"><label>Desde<input id="since" type="date"></label><label>Hasta<input id="until" type="date"></label><label class="token">Token de administración<input id="token" type="password" autocomplete="off" placeholder="PLOP_ADMIN_TOKEN"></label><button id="load">Actualizar KPIs</button></section>
<p id="status" class="status muted">Ingresá el token para consultar el panel.</p><section id="cards" class="cards"></section><section class="panel"><h2>Productos con más facturación</h2><table class="table"><thead><tr><th>Producto</th><th>Unidades</th><th>Facturación</th></tr></thead><tbody id="products"><tr><td colspan="3">Sin datos cargados.</td></tr></tbody></table></section></main>
<script>
const money=value=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(value||0));
const dateInput=(date)=>date.toISOString().slice(0,10); const now=new Date(); document.querySelector('#until').value=dateInput(now); document.querySelector('#since').value=dateInput(new Date(now.getTime()-30*86400000));
const status=document.querySelector('#status'); const cards=document.querySelector('#cards'); const products=document.querySelector('#products');
document.querySelector('#load').addEventListener('click',async()=>{status.className='status muted';status.textContent='Consultando datos…';const token=document.querySelector('#token').value.trim();if(!token){status.className='status error';status.textContent='Falta el token de administración.';return}try{const params=new URLSearchParams({since:new Date(document.querySelector('#since').value+'T00:00:00').toISOString(),until:new Date(document.querySelector('#until').value+'T23:59:59').toISOString()});const res=await fetch('/api/kpis?'+params,{headers:{'x-admin-token':token}});const data=await res.json();if(!res.ok)throw new Error(data.error||'No se pudo consultar el backend');const t=data.totals||{},f=data.funnel||{};const conversion=f.page_views?((t.orders/f.page_views)*100):0;cards.innerHTML=[['Pedidos',t.orders],['Confirmados',t.confirmed_orders],['Facturación',money(t.revenue)],['Ticket promedio',money(t.average_order_value)],['Señas registradas',money(t.deposits)],['Visitas',f.page_views],['Agregados al carrito',f.add_to_cart],['Conversión a pedido',conversion.toFixed(1)+'%']].map(([label,value])=>`<article class="card"><small>${label}</small><strong>${value}</strong></article>`).join('');products.innerHTML=(data.top_products||[]).length?data.top_products.map(p=>`<tr><td>${p.product_name||p.product_id||'Sin nombre'}</td><td>${p.units||0}</td><td>${money(p.revenue)}</td></tr>`).join(''):'<tr><td colspan="3">Todavía no hay pedidos en el período.</td></tr>';status.className='status muted';status.textContent='Datos actualizados correctamente.'}catch(error){status.className='status error';status.textContent=error.message}});
</script></body></html>
